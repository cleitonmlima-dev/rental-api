name: rental-pipeline

services:
  localstack:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/010-messaging.py:/etc/localstack/init/ready.d/010-messaging.py:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import json, urllib.request;
          state = json.load(urllib.request.urlopen('http://localhost:4566/_localstack/init/ready'));
          assert state['completed'] and all(s['state'] == 'SUCCESSFUL' for s in state['scripts'])
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: rental_admin
      POSTGRES_DB: rental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-rental_migrator_local}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-rental_app_local}
      OBSERVER_DB_PASSWORD: ${OBSERVER_DB_PASSWORD:-rental_observer_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/001-bootstrap.sh:/docker-entrypoint-initdb.d/001-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: rental_admin
      POSTGRES_DB: rental_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-rental_migrator_local}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-rental_app_local}
      OBSERVER_DB_PASSWORD: ${OBSERVER_DB_PASSWORD:-rental_observer_local}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./infra/postgres/001-bootstrap.sh:/docker-entrypoint-initdb.d/001-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: rental-pipeline-api:local
    build: .
    init: true
    environment:
      MIGRATION_DATABASE_URL: >-
        postgresql://rental_migrator:${MIGRATOR_DB_PASSWORD:-rental_migrator_local}@postgres:5432/rental
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-1000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-1000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-3000}
      DB_OPERATION_TIMEOUT_MS: ${DB_OPERATION_TIMEOUT_MS:-5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:rental-proposal-status}
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/infra/database/data-source.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: rental-pipeline-api:local
    build: .
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://rental_app:${APP_DB_PASSWORD:-rental_app_local}@postgres:5432/rental
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-1000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-1000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-3000}
      DB_OPERATION_TIMEOUT_MS: ${DB_OPERATION_TIMEOUT_MS:-5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:rental-proposal-status}
      SNS_PUBLISH_TIMEOUT_MS: ${SNS_PUBLISH_TIMEOUT_MS:-2000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(2000)})
          .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./infra/observability/collector.yml:/etc/otel/config.yml:ro
    ports:
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v3.7.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana_local}
      OBSERVER_DB_PASSWORD: ${OBSERVER_DB_PASSWORD:-rental_observer_local}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
